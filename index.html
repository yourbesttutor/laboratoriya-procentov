<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>Лаборатория процентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concept: тёмная неоновая лаборатория. Сверху меню разделов, ниже теория или опыты с колбами. */
:root{
  --bg:#0b0721; --bg2:#120a33; --panel:#191046; --line:#33257a;
  --fg:#f1efff; --muted:#a9a4dc;
  --cyan:#22f0ff; --pink:#ff3db4; --lime:#b8ff3a; --violet:#a566ff; --amber:#ffb01f;
  --good:#3dff9a; --bad:#ff4d6d;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --gutter:clamp(16px,4vw,32px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  background-image:radial-gradient(60rem 36rem at 8% -8%,rgba(255,61,180,.20),transparent 60%),radial-gradient(50rem 36rem at 100% 8%,rgba(34,240,255,.15),transparent 60%),radial-gradient(40rem 30rem at 50% 110%,rgba(165,102,255,.18),transparent 60%);
  background-attachment:fixed;
  color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:var(--gutter);padding-block:0 56px;
}
.app{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button{font-family:inherit}

/* header + nav */
.top{display:flex;align-items:center;gap:14px;padding-block:20px 14px}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 8px var(--cyan))}
.top h1{font-size:clamp(1.1rem,3.4vw,1.6rem);background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{color:var(--muted);font-size:.85rem}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*var(--gutter));padding:10px var(--gutter);background:rgba(11,7,33,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border:1px solid var(--line);border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.88rem;white-space:nowrap;background:var(--bg2);transition:box-shadow .2s,border-color .2s,color .2s}
.chip .n{font-family:var(--f-mono);font-weight:700;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--c);font-size:.8rem}
.chip .pr{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--c)}
.chip[aria-current=page]{color:var(--fg);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 20px -2px var(--c)}
.chip.done .pr{color:var(--good)}

/* section head */
.sec-head{display:flex;flex-direction:column;gap:10px;padding-block:28px 18px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.sec-head h2{font-size:clamp(1.5rem,5vw,2.4rem);text-shadow:0 0 24px color-mix(in srgb,var(--c) 55%,transparent)}
.sec-head .short{color:var(--muted);max-width:60ch}
.tabs{display:inline-flex;padding:4px;gap:4px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);align-self:flex-start}
.tab{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.95rem;padding:9px 20px;border-radius:10px;cursor:pointer}
.tab[aria-selected=true]{background:var(--c);color:#12062c;box-shadow:0 0 18px -2px var(--c)}

/* theory */
.th-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px 40px;align-items:start}
.th-main{display:flex;flex-direction:column;gap:16px}
.th-main h3{font-size:.95rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:8px}
.lead{font-size:1.15rem;max-width:62ch}
.formula{font-family:var(--f-mono);font-weight:500;font-size:1.05rem;color:var(--c);border:1px dashed var(--c);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent);overflow-wrap:anywhere}
.worked{display:flex;flex-direction:column;gap:8px}
.worked .wt{font-weight:700}
.worked ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;max-width:62ch}
.worked li::marker{color:var(--c);font-family:var(--f-mono)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ba>div{padding:14px;border-radius:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ba span{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.key{padding:14px 18px;border-radius:14px;background:rgba(61,255,154,.09);border:1px solid rgba(61,255,154,.5);max-width:62ch}
.was{background:rgba(255,77,109,.10);border:1px solid rgba(255,77,109,.55)}
.was span{color:var(--bad)}
.now{background:rgba(61,255,154,.09);border:1px solid rgba(61,255,154,.5)}
.now span{color:var(--good)}
.th-demo{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;align-items:center;gap:8px}
.demo-cap{color:var(--muted);font-size:.88rem;text-align:center;max-width:32ch}
.cta-row{margin-top:26px}

/* buttons */
.btn{font-weight:700;font-size:1rem;border-radius:12px;padding:12px 20px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;transition:transform .12s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--c,var(--pink));color:#12062c;border-color:transparent;box-shadow:0 0 24px -4px var(--c,var(--pink))}
.btn.ghost{background:transparent}

/* lab */
.lab{display:flex;flex-direction:column;gap:18px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.task-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dots i.on{background:var(--good);border-color:var(--good);box-shadow:0 0 10px var(--good)}
.task-text{font-size:1.15rem;max-width:64ch}
.task-text b{color:var(--c);font-family:var(--f-mono);font-weight:700}
.stage{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;padding-block:6px}
.flask{margin:0;flex:1 1 210px;max-width:300px;min-width:0}
.flask svg{width:100%;height:auto;display:block;overflow:visible}
.fl-title{font-family:var(--f-display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;min-height:1.2em;margin-bottom:2px}
.fl-cap{font-family:var(--f-mono);font-size:.8rem;text-align:center;color:var(--fg);margin-top:4px;min-height:1.4em}
.glass{fill:rgba(255,255,255,.05);stroke:var(--cyan);stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 7px var(--cyan));transition:stroke .4s,filter .4s}
.layers rect{transition:y .3s ease,height .3s ease,fill .7s ease}
.tick line{stroke:var(--muted);stroke-width:1.5}
.tick text{fill:var(--muted);font:500 10px var(--f-mono)}
.mk line{stroke:var(--amber);stroke-width:1.8;stroke-dasharray:6 4}
.mk text{fill:var(--amber);font:700 10px var(--f-mono);text-anchor:end}
.mk.ghost line{stroke:var(--lime)}.mk.ghost text{fill:var(--lime)}
.mk.goal line{stroke:var(--pink)}.mk.goal text{fill:var(--pink)}
.bub circle{fill:rgba(255,255,255,.55);animation:rise var(--d) linear infinite;animation-delay:var(--w)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-150px);opacity:0}}
.flask.ok .glass{stroke:var(--good);filter:drop-shadow(0 0 14px var(--good))}
.flask.ok svg{animation:pulse .9s ease}
.flask.boom .glass{stroke:var(--bad);filter:drop-shadow(0 0 14px var(--bad))}
.flask.boom .layers rect{fill:#fff}
.flask.shake svg{animation:shake .5s}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px) rotate(-3deg)}35%{transform:translateX(10px) rotate(3deg)}55%{transform:translateX(-8px)}75%{transform:translateX(6px)}}

.panel{display:flex;flex-direction:column;gap:14px}
.ctl-label{font-weight:700}
.rng-wrap{display:flex;flex-direction:column;gap:8px}
.rng-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rng-btns .step{min-width:56px;padding:8px 12px;font-family:var(--f-mono);font-size:.95rem}
.rv{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;color:var(--c);margin-left:auto;text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid var(--pink);box-shadow:0 0 14px var(--pink)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--pink);box-shadow:0 0 14px var(--pink)}
.ans-row{display:flex;align-items:center;gap:10px}
.ans-row input{width:min(200px,60%);font:700 1.6rem var(--f-mono);color:var(--lime);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;caret-color:var(--pink)}
.ans-row input:focus{border-color:var(--lime);outline:none;box-shadow:0 0 18px -4px var(--lime)}
.ans-row .unit{font:700 1.2rem var(--f-mono);color:var(--muted)}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.read{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);min-width:0}
.read .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.read .v{font-family:var(--f-mono);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.read.hot{border-color:var(--lime);box-shadow:0 0 18px -6px var(--lime)}
.read.hot .v{color:var(--lime)}
.run-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.memo{color:var(--muted);font-size:.9rem;font-family:var(--f-mono);overflow-wrap:anywhere}
.memo b{color:var(--c)}



/* task: bright hero card */
.task{background:var(--c);color:#12062c;border-radius:20px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 46px -6px var(--c);animation:taskglow 2.8s ease-in-out infinite}
@keyframes taskglow{50%{box-shadow:0 0 0 3px rgba(255,255,255,.3),0 0 64px -2px var(--c)}}
.task .task-meta{margin:0;justify-content:flex-start;gap:12px}
.task .dots{margin-left:auto}
.badge{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;background:#12062c;color:var(--c);padding:6px 12px;border-radius:999px}
.task .eyebrow{color:#12062c;font-weight:700}
.task .task-text{font-size:clamp(1.2rem,3.6vw,1.6rem);line-height:1.5;font-weight:600;max-width:60ch}
.task .task-text b{display:inline-block;vertical-align:baseline;line-height:1.15;background:#12062c;color:var(--c);padding:.06em .45em;border-radius:10px;font-family:var(--f-mono);white-space:nowrap}
.task .task-text b:has(.fr){vertical-align:middle;padding:.18em .45em;margin-block:.12em}
.task .task-go{font-size:.9rem;font-weight:700;opacity:.8}
.task .dots i{border-color:rgba(18,6,44,.55)}
.task .dots i.on{background:#12062c;border-color:#12062c;box-shadow:none}
.task.ok .dots i.on,.task.boom .dots i.on{background:#12062c}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin-inline:.18em;line-height:1.15;font-size:.92em;font-family:inherit;font-weight:inherit}
.fr .n{border-bottom:.09em solid currentColor;padding:0 .25em .04em}
.fr .d{padding:.04em .25em 0}

.rungs{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lvl-bars{display:flex;gap:4px;margin-top:.5em}.lvl-bars i{width:22px;height:8px;border-radius:4px;background:rgba(18,6,44,.22)}.lvl-bars i.on{background:#12062c}
.lvl-txt{font-size:.88rem;line-height:1.4;color:rgba(18,6,44,.85);max-width:60ch}.lvl-txt b{font-weight:800}
.lvl-why{display:block;margin-top:6px;font-size:.8rem;opacity:.85;border-left:3px solid rgba(18,6,44,.35);padding-left:8px}
.rg{font:700 .78rem var(--f-body);padding:4px 10px;border-radius:999px;border:2px solid rgba(18,6,44,.35);color:rgba(18,6,44,.75)}
.rg.on{background:#12062c;color:var(--c);border-color:#12062c}
.task{transition:background .5s}
.task.ok{background:var(--good)}
.task.ok .badge,.task.ok .rg.on{color:var(--good)}
.task.boom{background:var(--bad);animation:shake .5s}
.chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px}
.chain-cap{width:100%;text-align:center;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cn{display:flex;flex-direction:column;align-items:center;min-width:104px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);min-width:0}
.cn .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cn .v{font:700 1.1rem var(--f-mono);min-height:2.4em;display:flex;align-items:center;text-align:center;overflow-wrap:anywhere}
.eq{font:700 1.3rem var(--f-mono);color:var(--c)}

/* rack */
.rack{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;padding:10px 12px 14px;border-bottom:6px solid var(--violet);box-shadow:0 12px 20px -14px var(--violet)}
.tube{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;padding:4px 0;color:var(--fg);border-radius:12px}
.tube:hover .tglass{stroke:var(--lime)}
.tube svg{width:52px;height:auto;transition:transform .45s;transform-origin:50% 100%}
.tube .liq{transition:transform .5s;transform-box:fill-box;transform-origin:50% 100%}
.tglass{fill:rgba(255,255,255,.06);stroke:var(--cyan);stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--cyan))}
.tube.neg .tglass{stroke:var(--bad);stroke-dasharray:7 4;filter:drop-shadow(0 0 5px var(--bad))}
.tube .tl{font:700 1.05rem var(--f-mono)}
.tube .tn{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tube.used svg{transform:rotate(-26deg) translateY(-4px)}
.tube.used .liq{transform:scaleY(0)}
.tube.used .tl{color:var(--muted);text-decoration:line-through}

/* map */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px 40px;align-items:center;padding-block:34px 10px}
.hero h2{font-size:clamp(1.8rem,6vw,3.2rem);text-shadow:0 0 30px rgba(255,61,180,.5)}
.hero .lead{color:var(--muted);margin-top:14px}
.rule{margin-top:18px;border:1px solid var(--amber);border-radius:14px;padding:12px 16px;box-shadow:0 0 22px -8px var(--amber);max-width:60ch}
.rule b{color:var(--amber)}
.hero-demo{display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-demo .flask svg{cursor:ns-resize;touch-action:pan-y}
.demo-hint{color:var(--muted);font-size:.88rem;text-align:center;max-width:30ch}
@media (hover:none),(pointer:coarse){.demo-hint{display:none}}
.group{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.group h3{font-size:1rem;color:var(--fg)}
.group h3 small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.88rem;margin-top:4px}
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rm{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--fg);background:var(--bg2);transition:border-color .2s,box-shadow .2s,transform .15s;min-width:0}
.rm:hover{border-color:var(--c);box-shadow:0 0 22px -6px var(--c);transform:translateY(-2px)}
.rm .n{font-family:var(--f-body);font-size:.86rem;color:var(--c);font-weight:500}
.rm .nm{font-family:var(--f-display);font-size:.95rem;line-height:1.2}
.rm .sh{color:var(--muted);font-size:.86rem}
.rm .pr{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-top:auto}
.rm.done .pr{color:var(--good)}
.how{margin-top:30px}

.how h3{font-size:clamp(1.4rem,3.4vw,2rem);margin-bottom:6px}
.how-lead{color:var(--muted);max-width:68ch;margin-bottom:14px}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.how-grid div{position:relative;padding:16px 16px 16px 58px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:4px;line-height:1.5}
.how-grid i{position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--f-mono);font-style:normal;background:var(--c);color:#12062c}
.how-grid b{font-family:var(--f-display);font-size:1rem;color:var(--fg)}
.chain .chain-row{display:contents}
.chain-wait{width:100%;text-align:center;color:var(--muted);font-size:.85rem}
.chain .chain-row[hidden]{display:none}
.chain .chain-row[hidden]+.memo{margin-top:0;padding-top:0;border-top:0}
.chain .memo{width:100%;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);text-align:center}

.foot{margin-top:56px;padding-block:18px 8px;text-align:center;font-size:.8rem;line-height:1.7;color:var(--muted);text-wrap:balance}
.foot a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.foot a:hover{color:var(--cyan)}

/* modal + fx */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,255,255,.95),rgba(255,61,180,.55) 22%,transparent 58%)}
.flash.go{animation:boomf .7s ease-out}
@keyframes boomf{0%{opacity:1}100%{opacity:0}}
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(6,3,20,.74);backdrop-filter:blur(4px)}
.dlg{max-width:500px;width:100%;max-height:90dvh;overflow:auto;border-radius:22px;padding:22px;background:var(--panel);border:2px solid var(--c);box-shadow:0 0 44px -6px var(--c);display:flex;flex-direction:column;gap:12px;animation:pop .28s ease-out}
.dlg h3{font-size:1.5rem;color:var(--c);text-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.dlg .body{display:flex;flex-direction:column;gap:8px}
.dlg .expl{border-top:1px dashed var(--line);padding-top:10px;color:var(--muted)}
.dlg .expl b{color:var(--fg)}
.dlg .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
@keyframes pop{from{transform:scale(.9);opacity:0}}

@media (max-width:760px){
  .th-grid,.hero{grid-template-columns:minmax(0,1fr)}
  .th-demo{position:static;order:-1}
  .ba{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<script>
(function(){
/* ===== helpers ===== */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2});
const isInt=n=>Math.abs(n-Math.round(n))<1e-9;
const isNum=n=>typeof n==='number'&&isFinite(n);
const BLUE='#2d9bff',PINK='#ff3db4',LIME='#b8ff3a',CYAN='#22f0ff',VIOLET='#a566ff',GOOD='#3dff9a';
const concColor=c=>`hsl(${Math.round(185+Math.min(Math.max(c,0),60)*2.1)} 100% 58%)`;

const massTicks=cap=>{const st=cap<=400?50:cap<=1000?100:200;const a=[];for(let m=0;m<=cap;m+=st)a.push({f:m/cap,t:String(m)});return a};
const sliderMax=(x,k)=>Math.ceil(x*k/10)*10;

/* ===== generators: each returns a task ===== */
function g1(level){

    text=`Налей столько, чтобы пустыми остались ровно <b>${e}%</b> колбы.`;
    expl=`Вся колба — 100%. Пустые ${e}%, значит налито 100 − ${e} = ${target}%.`}
  return{text,kind:'slider',slider:{min:0,max:100,step:1,big:10,init:0,unit:'%',label:'Сколько налить'},drag:{tool:'bottle',color:BLUE,label:'Реагент',to:0,hint:'реагент на колбу и держи'},answer:target,
    view(v){return{flasks:[{title:'Колба',layers:[{f:v/100,color:BLUE}],ticks:tk(10,x=>Math.round(x*100)+'%'),marks:[{f:1,t:'100%'}],caption:`налито <b>${fmt(v)}%</b>`}],
      chain:{n:v,d:100,part:fmt(v)+' из 100 делений'},reads:[{k:'Налито',v:fmt(v)+'%',hot:true},{k:'Осталось пустым',v:fmt(100-v)+'%'}]}},
    wrong:v=>`Налито ${fmt(v)}%, а нужно ${fmt(target)}%.`,
    hint:'1% — это одна сотая колбы. Вся колба — это 100%.',explain:expl,
    memo:'<b>p% = p/100</b>, вся колба = 100%'};
}
function g2(level){
  let V,p,ml;
  for(;;){V=pick([200,250,400,500,600,800,1000]);p=pick(level<2?[10,20,25,50]:[5,15,30,40,60,75,80]);ml=V*p/100;if(isInt(ml))break}
  const big=V>=500?50:10;
  return{text:`В колбе <b>${V} мл</b> реагента — это 100%. Отлей в пробирку <b>${p}%</b> от этого объёма.`,
    kind:'slider',slider:{min:0,max:V,step:1,big,init:0,unit:'мл',label:'Сколько мл отлить'},drag:{from:0,to:1,hint:'колбу на пробирку и держи'},answer:ml,
    view(x){const tks=tk(10,f=>fmt(V*f));return{flasks:[
      {title:'Колба',layers:[{f:(V-x)/V,color:BLUE}],ticks:tks,marks:[{f:1,t:'100%'}],caption:`осталось ${fmt(V-x)} мл`},
      {title:'Пробирка',layers:[{f:x/V,color:PINK}],ticks:tks,marks:[{f:1,t:'100%'}],caption:`отлито <b>${fmt(x)} мл</b>`}],
      chain:{n:x,d:V,part:`${fmt(x)} мл из ${V} мл`},reads:[{k:'Отлито',v:fmt(x)+' мл'},{k:'Это от колбы',v:fmt(x/V*100)+'%',hot:true},{k:'Нужно',v:p+'%'}]}},
    wrong:x=>`Отлито ${fmt(x)} мл — это ${fmt(x/V*100)}% от ${V} мл, а нужно ${p}%.`,
    hint:'Часть от числа: число × p ÷ 100. Сначала найди, чему равен 1%.',
    explain:`1% от ${V} мл = ${V} ÷ 100 = ${fmt(V/100)} мл. Тогда ${p}% = ${fmt(V/100)} × ${p} = <b>${ml} мл</b>.`,
    memo:'<b>часть = целое × p ÷ 100</b>'};
}
function g3(level){
  const two=level%2===1;
  if(!two){let V,p,d;for(;;){V=pick([200,250,400,500,50,80,120]);p=pick(level<2?[25,50,10,20]:[15,35,45,60,75,80]);d=V*p/100;if(isInt(d))break}
    return input3(`В колбе <b>${V} мл</b> смеси, из них <b>${d} мл</b> красного реагента. Сколько процентов смеси составляет красный реагент?`,
      [{f:d/V,color:PINK},{f:(V-d)/V,color:BLUE}],V,d,p,`${d} ÷ ${V} = ${fmt(d/V)} = ${p}%.`,null,`красный ${d} мл из ${V} мл`)}
  let a,b,p;for(;;){a=rnd(2,16)*5;b=rnd(2,16)*5;p=a/(a+b)*100;if(isInt(p)&&a!==b)break}
  return input3(`Смешали <b>${a} мл</b> красного и <b>${b} мл</b> синего реагента. Сколько процентов смеси составляет красный?`,
    [{f:a/(a+b),color:PINK},{f:b/(a+b),color:BLUE}],a+b,a,p,`Смесь = ${a} + ${b} = ${a+b} мл — это 100%. ${a} ÷ ${a+b} = ${fmt(p/100)} = ${p}%.`,
    v=>Math.abs(v-a/b*100)<0.01?`Ты делил на синий (${b} мл). За 100% принимается вся смесь: ${a+b} мл.`:null,`всего ${a+b} мл`);
}
function input3(text,layers,total,part,p,expl,trap,cap){
  return{text,kind:'input',input:{unit:'%',label:'Твой ответ'},answer:p,
    view(v){const g=isNum(v)&&v>=0;return{flasks:[{title:'Смесь',layers,ticks:tk(10,x=>Math.round(x*100)+'%'),
      marks:[{f:1,t:'100%'}].concat(g?[{f:v/100,t:'ответ',cls:'ghost'}]:[]),caption:cap}],
      chain:g?{n:v,d:100,part:`по твоему ответу: ${fmt(v/100*total)} мл из ${fmt(total)} мл`}:null,reads:[{k:'Часть',v:fmt(part)+' мл'},{k:'Целое (100%)',v:fmt(total)+' мл'},{k:'Твой ответ',v:g?fmt(v)+'%':'—',hot:true}]}},
    wrong:v=>(trap&&trap(v))||`Ты ответил ${fmt(v)}%, а красный слой на колбе доходит до отметки ${fmt(p)}%.`,
    hint:'Процентное отношение: часть ÷ целое × 100%. Целое — это то, с чем сравниваем.',explain:expl,
    memo:'<b>p = часть ÷ целое × 100%</b>'};
}
function g4(level){
  let T,p,d;for(;;){T=pick([100,150,200,250,300,400,500,600,800]);p=pick(level<2?[50,25,20,10]:[40,60,75,80,30,15]);d=T*p/100;if(isInt(d)&&d>=10)break}
  const mx=Math.round(T*1.7);const big=mx>=600?50:10;
  return{text:`<b>${d} мл</b> красного реагента — это <b>${p}%</b> всей смеси. Доливай синий реагент, пока красный не станет ровно ${p}% смеси. Сколько мл смеси получится?`,
    kind:'slider',slider:{min:d,max:mx,step:1,big,init:d,unit:'мл',label:'Всего смеси'},drag:{tool:'bottle',color:BLUE,label:'Синий реагент',to:0,hint:'синий реагент на колбу и держи'},answer:T,
    view(t){return{flasks:[{title:'Смесь',layers:[{f:d/mx,color:PINK},{f:(t-d)/mx,color:BLUE}],ticks:tk(10,f=>fmt(mx*f)),
      marks:[{f:t/mx,t:'100%'}],caption:`красный ${d} мл, всего <b>${fmt(t)} мл</b>`}],
      chain:{n:d,d:t,part:`${d} мл из ${fmt(t)} мл`},reads:[{k:'Красный',v:d+' мл'},{k:'Всего сейчас',v:fmt(t)+' мл'},{k:'Красный от целого',v:fmt(d/t*100)+'%',hot:true},{k:'Нужно',v:p+'%'}]}},
    wrong:t=>`Сейчас в колбе ${fmt(t)} мл, красный — это ${fmt(d/t*100)}% смеси, а нужно ${p}%.`,
    hint:'Число по проценту: часть ÷ p × 100. Целое всегда больше части.',
    explain:`${p}% ↔ ${d} мл. Значит 1% = ${d} ÷ ${p} = ${fmt(d/p)} мл, а 100% = ${fmt(d/p)} × 100 = <b>${T} мл</b>.`,
    memo:'<b>целое = часть ÷ p × 100</b>'};

function g5(level){
  const kind=level<3?(level%2===0?'inc':'dec'):level<5?'rev':pick(['inc','dec','rev']);
  if(kind==='rev'){
    const pr=pick([['inc',25,20],['inc',100,50],['inc',300,75],['inc',150,60],['dec',20,25],['dec',50,100],['dec',60,150],['dec',75,300]]);
    const V0=pick([200,400,500]);const up=pr[0]==='inc';const V1=V0*(1+(up?pr[1]:-pr[1])/100);const q=pr[2];
    const cap=Math.max(V0,V1)*1.15;
    return{text:`Объём в колбе ${up?'увеличили':'уменьшили'} на <b>${pr[1]}%</b>. На сколько процентов теперь нужно ${up?'уменьшить':'увеличить'} <b>новый</b> объём, чтобы вернуться к исходным <b>${V0} мл</b>?`,
      kind:'input',input:{unit:'%',label:'Твой ответ'},answer:q,
      view(v){const g=isNum(v)&&v>=0;const g2=g?V1*(1+(up?-v:v)/100):null;
        return{flasks:[
          {title:'Было',layers:[{f:V0/cap,color:BLUE}],marks:[{f:V0/cap,t:'100%'}],caption:`${V0} мл = 100%`},
          {title:'Стало',layers:[{f:V1/cap,color:up?LIME:VIOLET}],marks:[{f:V1/cap,t:'100%'},{f:V0/cap,t:'цель',cls:'goal'}].concat(g?[{f:Math.min(g2/cap,1.05),t:'ответ',cls:'ghost'}]:[]),caption:`${fmt(V1)} мл — теперь это 100%`}],
          chain:g?{n:v,d:100,part:`${fmt(v)}% от нового объёма`}:null,reads:[{k:'Новая база (100%)',v:fmt(V1)+' мл'},{k:'Цель',v:V0+' мл'},{k:'Твой ответ',v:g?fmt(v)+'%':'—',hot:true}]}},
      wrong:v=>Math.abs(v-pr[1])<0.01?`Ты взял тот же процент. Но теперь 100% — это уже ${fmt(V1)} мл, а не ${V0} мл.`:`При ответе ${fmt(v)}% объём станет ${fmt(V1*(1+(up?-v:v)/100))} мл, а нужно ${V0} мл.`,
      hint:'Спроси себя: что теперь принимается за 100%? Считай проценты от нового объёма.',
      explain:`После изменения: ${V0} × ${fmt(1+(up?pr[1]:-pr[1])/100)} = ${fmt(V1)} мл. Вернуться надо на ${fmt(Math.abs(V1-V0))} мл. Это ${fmt(Math.abs(V1-V0))} ÷ ${fmt(V1)} × 100 = <b>${q}%</b> от нового объёма.`,
      memo:'<b>за 100% принимаем то, от чего считаем</b>'};}
  const V0=pick([200,250,400,500,600,800]);let p;for(;;){p=pick(level<2?[10,20,25,50]:[30,40,60,75]);if(isInt(V0*p/100))break}
  const up=kind==='inc';const tg=Math.round(V0*(1+(up?p:-p)/100)*1e6)/1e6;const cap=V0*2;const big=V0>=500?50:10;
  return{text:`В колбе <b>${V0} мл</b> — это 100%. ${up?`Увеличь объём на <b>${p}%</b>.`:`Отлей так, чтобы объём уменьшился на <b>${p}%</b>.`}`,
    kind:'slider',slider:{min:0,max:V0*2,step:1,big,init:V0,unit:'мл',label:'Объём в колбе'},answer:tg,
    view(v){const ch=(v/V0-1)*100;return{flasks:[{title:'Колба',
      layers:v>V0?[{f:V0/cap,color:BLUE},{f:(v-V0)/cap,color:LIME}]:[{f:v/cap,color:BLUE}],
      ticks:tk(8,f=>Math.round(f*200)+'%'),marks:[{f:V0/cap,t:'100%'}],caption:`сейчас <b>${fmt(v)} мл</b>`}],
      chain:{n:v,d:V0,part:`${fmt(v)} мл к исходным ${V0} мл`},reads:[{k:'Стало',v:fmt(v)+' мл'},{k:'Изменение',v:(ch>0?'+':'')+fmt(ch)+'%',hot:true},{k:'Коэффициент',v:'× '+fmt(v/V0)},{k:'Нужно',v:(up?'+':'−')+p+'%'}]}},
    wrong:v=>`Сейчас ${fmt(v)} мл — это ${(v>=V0?'+':'')+fmt((v/V0-1)*100)}% к исходному, а нужно ${up?'+':'−'}${p}%.`,
    hint:up?'Увеличить на p% — значит умножить на 1 + p/100.':'Уменьшить на p% — значит умножить на 1 − p/100.',
    explain:`Коэффициент: 1 ${up?'+':'−'} ${fmt(p/100)} = ${fmt(1+(up?p:-p)/100)}. ${V0} × ${fmt(1+(up?p:-p)/100)} = <b>${fmt(tg)} мл</b>.`,
    memo:'<b>× (1 + p/100)</b> — увеличить, <b>× (1 − p/100)</b> — уменьшить'};
}
function saltFlask(s,w,extra){return[{f:s,color:PINK},{f:w,color:BLUE}]}
function g6(level){
  const kind=['a','b','c','b','a'][level%5];
  let M,c,s;for(;;){M=pick([100,150,200,250,300,400,500]);c=pick(level<2?[10,20,25,50]:[5,12,15,30,40]);s=M*c/100;if(isInt(s))break}

      chain:{n:x,d:M,part:`${fmt(x)} г соли из ${M} г раствора`},reads:[{k:'Соль',v:fmt(x)+' г'},{k:'Вода',v:fmt(M-x)+' г'},{k:'Концентрация',v:fmt(x/M*100)+'%',hot:true},{k:'Нужно',v:c+'%'}]}},

  if(kind==='b')return{text:`В <b>${w} г</b> воды растворили <b>${s} г</b> соли. Какова концентрация раствора в процентах?`,
    kind:'input',input:{unit:'%',label:'Твой ответ'},answer:c,
    view(v){const g=isNum(v)&&v>=0;return{flasks:[{title:'Раствор',layers:[{f:s/M,color:PINK},{f:w/M,color:BLUE}],ticks:tk(10,f=>Math.round(f*100)+'%'),

      chain:g?{n:v,d:100,part:`по твоему ответу: ${fmt(v/100*M)} г соли из ${M} г`}:null,reads:[{k:'Вода',v:w+' г'},{k:'Соль',v:s+' г'},{k:'Масса раствора',v:M+' г'},{k:'Твой ответ',v:g?fmt(v)+'%':'—',hot:true}]}},
    wrong:v=>Math.abs(v-s/w*100)<0.01?`Ты делил на воду. Раствор — это вода + соль = ${M} г, и именно он равен 100%.`:`Ты ответил ${fmt(v)}%, а соляной слой доходит до отметки ${c}%.`,
    hint:'Сначала найди массу раствора: вода + соль. Потом соль ÷ раствор × 100%.',
    explain:`Раствор: ${w} + ${s} = ${M} г. c = ${s} ÷ ${M} × 100% = <b>${c}%</b>.`,memo:'<b>m(раствора) = m(воды) + m(соли)</b>'};
  return{text:`Сколько граммов <b>воды</b> нужно, чтобы получить <b>${M} г</b> раствора с концентрацией <b>${c}%</b>?`,
    kind:'input',input:{unit:'г',label:'Твой ответ'},answer:w,
    view(v){const g=isNum(v)&&v>=0&&v<=M;return{flasks:[{title:'Раствор',layers:[{f:s/M,color:PINK},{f:w/M,color:BLUE}],ticks:tk(10,f=>fmt(M*f)),

function mkRack(mode,nSol,useNeg,extra){

const F0=s=>String(s).replace(/(?<![\p{L}\d.,])(\d+|[a-z])\/(\d+|[a-z])(?![\p{L}\d])/gu,'<span class="fr"><span class="n">$1</span><span class="d">$2</span></span>');
const TERM='(?:\\([^()]*\\)|[\\p{L}\\d][\\p{L}\\d₀-₉%²·]*(?:[.,][\\p{L}\\d₀-₉%²·]+)*(?:\\([^()]*\\))?)';
const CHAIN=new RegExp(TERM+'(?: [×÷] '+TERM+')+','gu');

function D(s){
  s=s.replace(/\(([^()<]*)\)/g,(m,i)=>i.includes('÷')?'('+D(i)+')':m);
  return s.replace(CHAIN,m=>{
    if(!m.includes('÷'))return m;
    const parts=m.split(/ ([×÷]) /);let acc=parts[0],den=null;
    for(let i=1;i<parts.length;i+=2){const op=parts[i],t=parts[i+1];
      if(op==='×'){if(den===null)acc+=' × '+t;else{acc=frac(acc,den)+' × '+t;den=null}}

    return den!==null?frac(acc,den):acc});
}

function makeFlask(){

  let bub='';for(let i=0;i<7;i++)bub+=`<circle cx="${84+i*20}" cy="${218-(i%3)*6}" r="${2+(i%3)}" style="--d:${2.4+i*.35}s;--w:${-i*.5}s"/>`;

  const q=s=>root.querySelector(s);const layersG=q('.layers'),ticksG=q('.ticks'),marksG=q('.marks'),clipR=q(`#${id}l rect`);
  const mk=(tag,at)=>{const e=document.createElementNS(SVGNS,tag);for(const k in at)e.setAttribute(k,at[k]);return e};

const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],raf=0,lastT=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}

const FOAM=['#ffffff','#c9f9ff','#ff8fd6','#b8ff3a','#e6d4ff'],SPARK=['#3dff9a','#b8ff3a','#22f0ff','#ffe62e','#ff3db4'];
function burst(x,y,kind){
  const foam=kind==='foam',n=reduce?16:foam?110:70;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(foam?180:140)+Math.random()*(foam?560:380);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(foam?260:140),r:foam?5+Math.random()*15:2+Math.random()*3,t:0,m:foam?1.5+Math.random()*1.3:1.1+Math.random(),col:pick(foam?FOAM:SPARK),foam})}
  if(!raf){lastT=performance.now();raf=requestAnimationFrame(loop)}
}
function loop(now){
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.t<p.m&&p.y<innerHeight+40);
  for(const p of parts){p.t+=dt;p.vy+=(p.up?-30:p.foam?700:520)*dt;p.vx*=.992;p.x+=p.vx*dt;p.y+=p.vy*dt;
    const a=Math.max(0,1-(p.t/p.m)**2);cx.globalAlpha=a;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();
    if(p.foam){cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=1.5;cx.stroke()}}
  cx.globalAlpha=1;raf=parts.length?requestAnimationFrame(loop):0;
}

function flyBack(g,el){const r=el.getBoundingClientRect();g.style.transition='transform .28s ease,opacity .28s';g.style.transform=`translate(${r.left}px,${r.top}px) rotate(0deg)`;g.style.opacity='.2';setTimeout(()=>g.remove(),300)}
function puff(x,y){if(reduce)return;parts.push({x:x+(Math.random()-.5)*40,y,vx:(Math.random()-.5)*30,vy:-60-Math.random()*50,r:6+Math.random()*9,t:0,m:1.1+Math.random()*.6,col:'rgba(225,245,255,.75)',up:1});if(!raf){lastT=performance.now();raf=requestAnimationFrame(loop)}}
function enableDrag(el,o){
  el.classList.add('dragsrc');if(!o.long)el.style.touchAction='none';
  el.addEventListener('click',e=>{if(el._dr){el._dr=false;e.stopImmediatePropagation();e.preventDefault()}},true);
  el.addEventListener('pointerdown',e=>{
    if((e.pointerType==='mouse'&&e.button!==0)||!o.ok())return;
    const sx=e.clientX,sy=e.clientY,touch=e.pointerType==='touch';
    let on=false,ready=!(o.long&&touch),g=null,ox=0,oy=0,over=false,px=sx,py=sy,raf2=0,last=0,stream=null,tm=0;
    el._dr=false;
    const place=()=>{g.style.transform=`translate(${px-ox}px,${py-oy}px) rotate(${over?-60:0}deg)`;
      if(stream){const t=o.target().getBoundingClientRect();stream.style.left=(px-2)+'px';stream.style.top=py+'px';stream.style.height=Math.max(0,t.top+t.height*.55-py)+'px'}};
    const tick=now=>{const dt=Math.min((now-last)/1000,.05);last=now;if(over&&o.hold)o.hold(dt,px,py);raf2=requestAnimationFrame(tick)};
    const tmv=ev=>{if(on)ev.preventDefault()};
    const cleanup=()=>{clearTimeout(tm);removeEventListener('pointermove',move);removeEventListener('pointerup',end);removeEventListener('pointercancel',end);removeEventListener('touchmove',tmv)};
    const move=ev=>{px=ev.clientX;py=ev.clientY;
      if(!on){if(Math.hypot(px-sx,py-sy)<8){return}
        if(!ready){cleanup();return}
        on=true;el._dr=true;const r=el.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
        g=(o.ghostOf?o.ghostOf():el).cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.transformOrigin=ox+'px '+oy+'px';document.body.appendChild(g);
        el.classList.add('lifted');document.body.classList.add('dragging');last=performance.now();raf2=requestAnimationFrame(tick);o.start&&o.start()}
      const was=over;over=hitEl(o.target(),px,py);
      if(over!==was){g.classList.toggle('pouring',over);o.target().classList.toggle('drop',over);
        if(over&&o.stream){stream=document.createElement('div');stream.className='stream';stream.style.background=typeof o.stream==='function'?o.stream():o.stream;document.body.appendChild(stream)}
        else if(stream){stream.remove();stream=null}
        o.over&&o.over(over)}
      place()};
    const end=()=>{const wasOn=on;cleanup();if(!wasOn)return;cancelAnimationFrame(raf2);document.body.classList.remove('dragging');el.classList.remove('lifted');o.target().classList.remove('drop');
      const ctx={g,over,stream,fly:()=>{stream&&stream.remove();flyBack(g,el)},done:()=>{stream&&stream.remove();g.remove()}};
      o.end?o.end(ctx):ctx.fly()};
    addEventListener('pointermove',move);addEventListener('pointerup',end);addEventListener('pointercancel',end);addEventListener('touchmove',tmv,{passive:false});
    if(!ready)tm=setTimeout(()=>{ready=true;move({clientX:px,clientY:py})},200);
  });
}

  let task,flasks=[],value,attempts=0,locked=false,rung=1,sliderSet=null,busy=false;
  host.innerHTML=`<div class="lab"><section class="task" aria-label="Задача"><div class="task-meta"><span class="badge">Задача</span><span class="eyebrow">На этой ступени: <b class="num"></b> из ${STEP}</span><div class="dots" aria-label="Прогресс"></div></div>
  <div class="rungs" aria-label="Ступени"></div><p class="task-text"></p><p class="task-go"></p></section>
  <div class="stage"></div><div class="card panel"><div class="ctl"></div><div class="reads"></div><div class="run-row"><button class="btn primary run">Запустить реакцию</button></div></div><div class="card chain" hidden><div class="chain-row"></div><p class="memo"></p></div></div>`;
  const $q=s=>host.querySelector(s);
  function dots(){const g=gs(sec.id);const inStep=g.closed?STEP:g.streak-STEP*(rungOf(g)-1);$q('.dots').innerHTML=Array.from({length:STEP},(_,i)=>`<i class="${i<inStep?'on':''}"></i>`).join('');$q('.num').textContent=inStep;
    $q('.rungs').innerHTML=`<div class="lvl-bars">${RUNG_NAME.map((n,i)=>`<i class="${i+1<=rung?'on':''}"></i>`).join('')}</div><div class="lvl-txt"><b>Ступень ${rung} из 3 · ${RUNG_NAME[rung-1]}.</b> ${RUNG_HELP[rung-1]}<span class="lvl-why">Сейчас ты решишь пять задач с подсказками, потом попробуешь справляться сам ещё с пятью, а финальные пять будут в формате ОГЭ. Перепрыгнуть нельзя: каждая ступень готовит к следующей. Ошибся — не страшно, вернёмся на шаг назад, где проще.</span></div>`}
  const arg=()=>task.kind==='slider'||task.kind==='rack'?value:(isNum(value)?value:null);
  function update(){
    if(task.exam){$q('.reads').innerHTML='';$q('.reads').hidden=true;$q('.chain').hidden=true;return}
    let d=task.view(arg());if(task.kind==='rack')paintTubes();
    if(rung>=2){const live=task.kind!=='input';
      d={flasks:d.flasks.map(f=>({...f,caption:live?'':f.caption,marks:(f.marks||[]).filter(m=>m.cls!=='ghost')})),reads:live?d.reads.filter(r=>r.k==='Нужно'):d.reads,chain:null}}
    flasks.forEach((f,i)=>f.set(d.flasks[i]));
    const ch=$q('.chain'),cr=$q('.chain-row'),has=d.chain&&isNum(d.chain.n)&&d.chain.d>0,empty=!has&&task.kind==='input'&&rung===1;cr.hidden=!has&&!empty;cr.innerHTML=has?chainHTML(d.chain):empty?chainEmpty():'';ch.hidden=!has&&!empty&&!$q('.memo').innerHTML;
    $q('.reads').innerHTML=d.reads.map(r=>`<div class="read${r.hot?' hot':''}"><div class="k">${F(r.k)}</div><div class="v">${F(r.v)}</div></div>`).join('');$q('.reads').hidden=!d.reads.length}
  function build(){
    const g=gs(sec.id);rung=rungOf(g);attempts=0;locked=false;busy=false;sliderSet=null;
    let src=sec,review=null;const idx=SECS.indexOf(sec);
    if(rung>=2&&!g.closed&&idx>0&&g.n>=2&&Math.random()<.3){src=pick(SECS.slice(0,idx));review=src.name}
    task=rung===3?src.exam(g.n):src.gen(g.n);g.n++;saveProg();
    const tk_=$q('.task');tk_.classList.remove('ok','boom');
    $q('.badge').textContent=rung===3?'Задача · ОГЭ':'Задача';
    const GO=task.exam?'Запиши ответ числом, как в бланке ОГЭ ↓':task.kind==='slider'?(task.drag?'Двигай ползунок под колбой или перетащи '+task.drag.hint+' ↓':'Двигай ползунок под колбой ↓'):task.kind==='rack'?'Нажимай на пробирки ниже или перетаскивай их в большую колбу ↓':'Впиши ответ в поле под колбой ↓';$q('.task-go').textContent=review?'Повторение: '+review+'. '+GO:GO;
    $q('.task-text').innerHTML=F(task.text);$q('.memo').innerHTML=task.exam?'':F('<b>Памятка:</b> '+task.memo);dots();
    $q('.stage').hidden=!!task.exam;
    value=task.kind==='slider'?task.slider.init:task.kind==='rack'?[]:NaN;
    const st=$q('.stage');st.innerHTML='';flasks=[];
    if(!task.exam){const n=task.view(task.kind==='input'?null:value).flasks.length;for(let i=0;i<n;i++){const f=makeFlask();flasks.push(f);st.appendChild(f.root)}}
    const ctl=$q('.ctl');
    if(task.kind==='slider'){const s=task.slider;
      ctl.innerHTML=`<div class="rng-wrap"><label class="ctl-label" for="rng">${s.label}</label><input id="rng" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.init}">
      <div class="rng-btns"><button class="btn step" data-d="${-s.big}">−${s.big}</button><button class="btn step" data-d="${-s.step}">−${s.step}</button><button class="btn step" data-d="${s.step}">+${s.step}</button><button class="btn step" data-d="${s.big}">+${s.big}</button><span class="rv"><span id="rvv"></span> ${s.unit}</span></div></div>`;
      const r=ctl.querySelector('#rng'),rv=ctl.querySelector('#rvv');
      const set=v=>{v=Math.min(s.max,Math.max(s.min,v));value=v;r.value=v;rv.textContent=fmt(v);update()};sliderSet=set;
      r.oninput=()=>set(+r.value);ctl.querySelectorAll('.step').forEach(b=>b.onclick=()=>{if(!locked)set(value+ +b.dataset.d)});rv.textContent=fmt(value);
    }else if(task.kind==='rack'){
      ctl.innerHTML=`<div class="rack" role="group" aria-label="Штатив с пробирками">${task.tubes.map((t,i)=>{const lv=Math.min(Math.abs(t.h)/60,1)*150,uidT='tb'+(++uid);
        return`<button class="tube${t.h<0?' neg':''}" data-i="${i}" aria-pressed="false" aria-label="Пробирка ${t.label}"><svg viewBox="0 0 60 180" aria-hidden="true"><defs><clipPath id="${uidT}"><path d="M12 8 H48 V150 Q48 172 30 172 Q12 172 12 150 Z"/></clipPath></defs><g clip-path="url(#${uidT})"><rect class="liq" x="10" y="${172-lv}" width="40" height="${lv}" fill="${t.color}" opacity="${t.h<0?.75:1}"/></g><path class="tglass" d="M12 8 H48 V150 Q48 172 30 172 Q12 172 12 150 Z"/></svg><span class="tl">${t.label}</span><span class="tn">${t.h<0?'отлить':'налить'}</span></button>`}).join('')}</div>
      <div class="run-row"><span class="memo">Перетащи пробирку в большую колбу или просто нажми на неё. Чтобы вернуть, нажми на пустую пробирку.</span><button class="btn ghost rk-reset">Сбросить</button></div>`;
      ctl.querySelectorAll('.tube').forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;const k=value.indexOf(i);value=k>=0?value.filter(x=>x!==i):value.concat(i);update()});
      ctl.querySelector('.rk-reset').onclick=()=>{if(locked)return;value=[];update()};
      ctl.querySelectorAll('.tube').forEach(b=>enableDrag(b,{ok:()=>!locked&&!busy,target:()=>flasks[0].root,stream:()=>task.tubes[+b.dataset.i].color,
        end:ctx=>{const i=+b.dataset.i,used=value.includes(i);
          if(!used&&ctx.over){busy=true;ctx.g.classList.add('emptying');setTimeout(()=>{ctx.done();busy=false;if(!locked){value=value.concat(i);update()}},600)}
          else if(used&&!ctx.over){ctx.fly();value=value.filter(x=>x!==i);update()}
          else ctx.fly()}}));
    }else{
      ctl.innerHTML=`<div class="rng-wrap"><label class="ctl-label" for="ans">${task.input.label}</label><div class="ans-row"><input id="ans" inputmode="decimal" autocomplete="off" placeholder="?"><span class="unit">${task.input.unit}</span></div></div>`;
      const a=ctl.querySelector('#ans');a.oninput=()=>{value=parse(a.value);update()};a.onkeydown=e=>{if(e.key==='Enter')run()};
    }
    if(task.kind==='slider'&&task.drag&&sliderSet){
      const d=task.drag,s=task.slider;let acc=value,pt=0;
      const common={ok:()=>!locked&&!busy,target:()=>flasks[d.to].root,start:()=>{acc=value},over:on=>{if(on)acc=value},
        hold:dt=>{if(locked)return;acc=Math.min(s.max,Math.max(s.min,acc+(s.max-s.min)/3*dt));const v=Math.round(acc/s.step)*s.step;if(v!==value)sliderSet(v);
          if(d.puff){pt+=dt;if(pt>.05){pt=0;const r=flasks[d.to].root.getBoundingClientRect();puff(r.left+r.width/2,r.top+r.height*.35)}}}};
      if(d.tool){const w=document.createElement('div');w.className='tools';
        w.innerHTML=`<div class="tool" role="img" aria-label="${d.label}">${TOOLS[d.tool](d.color)}<span class="tl">${d.label}</span><span class="th">тяни на колбу и держи</span></div>`;
        $q('.stage').appendChild(w);enableDrag(w.firstChild,{...common,stream:d.tool==='steam'?null:d.color})}
      else{const src=flasks[d.from].root;enableDrag(src,{...common,long:true,ghostOf:()=>src,stream:()=>{const L=task.view(value).flasks[d.from].layers;return(L[0]&&L[0].color)||'#fff'}})}
    }
    update();
  }
  function paintTubes(){host.querySelectorAll('.tube').forEach(b=>{const u=value.includes(+b.dataset.i);b.classList.toggle('used',u);b.setAttribute('aria-pressed',u)})}
  function center(){if(!flasks.length){const r=$q('.task').getBoundingClientRect();return[(r.left+r.right)/2,(r.top+r.bottom)/2]}
    const r=flasks[0].root.getBoundingClientRect();const r2=flasks[flasks.length-1].root.getBoundingClientRect();return[(r.left+r2.right)/2,(r.top+r.bottom)/2]}
  function run(){
    if(locked)return;
    if(task.kind==='rack'&&!value.length)return;
    if(task.kind==='input'&&!isNum(value)){const a=$q('#ans');a.focus();a.style.borderColor='var(--bad)';setTimeout(()=>a.style.borderColor='',700);return}
    const ok=task.kind==='rack'?task.sum(value)===task.answer:Math.abs(value-task.answer)<0.005;const[x,y]=center();locked=true;
    const g=gs(sec.id),tcard=$q('.task');
    if(ok){const before=rungOf(g);let just=false;
      if(!g.closed){g.streak=Math.min(GOAL,g.streak+1);if(g.streak>=GOAL){g.closed=true;just=true}}saveProg();
      const after=rungOf(g);dots();tcard.classList.add('ok');
      flasks.forEach(f=>f.success());burst(x,y,'spark');setTimeout(()=>burst(x-80,y-40,'spark'),200);setTimeout(()=>burst(x+80,y-40,'spark'),350);
      const note=just?`<p>Все три ступени пройдены. Раздел закрыт! Дальше можно тренировать задачи в формате ОГЭ.</p>`:after>before?`<p>Следующая задача: ступень ${after}, ${RUNG_NAME[after-1].replace(/^./,m=>m.toLowerCase())}.</p>`:'';
      setTimeout(()=>modal({kind:'ok',title:just?'Раздел пройден!':'Всё верно!',html:F(`<p>${task.exam?'Верно. Так это решение записывают в работе.':'Реакция прошла правильно: раствор поменял цвет.'}</p><div class="expl">${task.explain}</div>${note}`),
        buttons:[{label:'Следующая задача',cls:'primary',fn:build}].concat(just&&SECS[sec.n]?[{label:'К следующему разделу',cls:'ghost',fn:()=>go(SECS[sec.n].id,'theory')}]:[])}),900);
    }else{attempts++;let note='';
      if(attempts===1&&!g.closed&&g.streak>0){const before=rungOf(g);g.streak=Math.max(0,g.streak-2);saveProg();const after=rungOf(g);dots();
        note=after<before?`<div class="expl">Вернёмся на шаг назад: следующая задача — ступень ${after}, ${RUNG_NAME[after-1].replace(/^./,m=>m.toLowerCase())}.</div>`:''}
      flasks.forEach(f=>f.boom());tcard.classList.add('boom');flashAt(x,y);burst(x,y,'foam');setTimeout(()=>burst(x-70,y+20,'foam'),140);
      setTimeout(()=>modal({kind:'bad',title:'Бум! Пена повсюду',html:F(`<p>${task.wrong(value)}</p><div class="expl"><b>Как правильно.</b> ${task.hint}</div>${attempts>=2?`<div class="expl"><b>Разбор.</b> ${task.explain}</div>`:''}${note}`),
        buttons:[{label:'Попробовать снова',cls:'primary',fn:()=>{locked=false;tcard.classList.remove('boom');flasks.forEach(f=>f.reset());if(task.kind==='slider'){const r=$q('#rng');value=task.slider.init;r.value=value;$q('#rvv').textContent=fmt(value)}else if(task.kind==='rack')value=[];update()}}]}),750)}
  }
  $q('.run').onclick=run;build();
}

/* ===== pages ===== */
const view=document.getElementById('view'),chips=document.getElementById('chips');
let cur='map',tabs={},heroTimer=0;
function pr(s){const g=gs(s.id);return g.closed?'✓':g.streak+'/'+GOAL}
function renderNav(){
  chips.innerHTML=`<a class="chip" href="#map" data-id="map" style="--c:#ff3db4" ${cur==='map'?'aria-current="page"':''}><span class="n">Δ</span>Журнал опытов</a>`+
  SECS.map(s=>`<a class="chip${gs(s.id).closed?' done':''}" href="#${s.id}" data-id="${s.id}" style="--c:${s.c}" ${cur===s.id?'aria-current="page"':''}><span class="n">${s.n}</span>${s.name}<span class="pr">${pr(s)}</span></a>`).join('');
  chips.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.id)});
  const act=chips.querySelector('[aria-current]');if(act&&act.scrollIntoView)act.scrollIntoView({inline:'center',block:'nearest'});
}
function go(id,tab){cur=id;if(tab)tabs[id]=tab;closeModal();try{history.replaceState(null,'','#'+id)}catch(e){}render();window.scrollTo({top:0})}
function render(){clearInterval(heroTimer);renderNav();const s=SECS.find(x=>x.id===cur);s?renderSection(s):renderMap()}
function renderMap(){
  view.style.setProperty('--c','#ff3db4');
  view.innerHTML=`<section class="hero"><div><h2>Проценты в колбах</h2><p class="lead">Одиннадцать разделов про дроби, смеси и проценты, как их проходят в школе с 5 по 9 класс. В каждом разделе сначала теория, потом опыты: двигай ползунок, смотри, как меняются проценты, и запускай реакцию. Верный ответ окрасит раствор, ошибка вызовет взрыв пены.</p>
  <p class="rule"><b>Главный вопрос любой задачи на проценты:</b> что здесь принимается за 100%? Самое важное всегда — правильно понять задачу.</p></div><div class="hero-demo" id="hd"></div></section>`+
  `<section class="how"><h3>Как здесь заниматься</h3><p class="how-lead">В каждом разделе три части. Иди по порядку, так проще всего. Алгоритм такой: теория, потом задача на колбе, потом реакция, и так до тех пор, пока не пройдёшь все три ступени.</p>
  <div class="how-grid"><div><i>1</i><b>Теория</b>Сначала прочитай теорию: идея, формула, разбор на числах и главное правило, которое нужно запомнить.</div><div><i>2</i><b>Ступени с задачами</b>Потом открой вкладку «Опыты». Там три ступени по пять задач: с подсказками, потом сам, в конце — как в ОГЭ. Следующая ступень открывается, когда решишь пять задач на этой. Пройдёшь все три — раздел закрыт.</div><div><i>3</i><b>Реакция</b>Задачу решаешь на колбе: двигаешь ползунок, наливаешь, отливаешь или вписываешь ответ — и запускаешь реакцию. Верно: раствор станет зелёным. Неверно: взрыв, пена и подсказка, как правильно.</div></div></section>
  <section class="group"><h3>Одиннадцать разделов<small>Номер раздела и класс, в котором тема проходится в школе</small></h3><div class="rm-grid">${SECS.map(s=>`<a class="rm${gs(s.id).closed?' done':''}" href="#${s.id}" data-id="${s.id}" style="--c:${s.c}"><span class="n">Раздел ${s.n} · ${s.grade}</span><span class="nm">${s.name}</span><span class="sh">${s.short}</span><span class="pr">${gs(s.id).closed?'пройден ✓':'верных подряд: '+gs(s.id).streak+' из '+GOAL}</span></a>`).join('')}</div></section>`;
  view.querySelectorAll('a.rm').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.id)});
  const f=makeFlask();const hd=document.getElementById('hd');hd.appendChild(f.root);f.root.style.maxWidth='280px';
  if(matchMedia('(hover:hover) and (pointer:fine)').matches)hd.insertAdjacentHTML('beforeend','<p class="demo-hint">Наведи курсор на колбу и води вверх-вниз: уровень и проценты меняются.</p>');
  const svg=f.root.querySelector('svg');let cur_p=25,hov=false,i=0;const vals=[25,60,90,35,75];
  const show=p=>{cur_p=p;f.set({title:'Пример',layers:[{f:p/100,color:concColor(p*.6)}],ticks:tk(10,x=>Math.round(x*100)+'%'),
    marks:[{f:1,t:'100%'}].concat(hov?[{f:p/100,t:p+'%',cls:'ghost'}]:[]),caption:`налито <b>${p}%</b> = ${fmt(p/100)}`})};
  const at=e=>{const r=svg.getBoundingClientRect();const y=(e.clientY-r.top)*250/r.height;show(Math.round(Math.min(100,Math.max(0,(224-y)/1.4))))};
  svg.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;hov=true;at(e)});
  svg.addEventListener('pointerdown',e=>{hov=e.pointerType!=='touch';at(e)});
  svg.addEventListener('pointerleave',()=>{hov=false;show(cur_p)});
  show(vals[0]);heroTimer=setInterval(()=>{if(hov)return;i++;show(vals[i%vals.length])},2600);
}
function renderSection(s){
  const tab=tabs[s.id]||'theory';view.style.setProperty('--c',s.c);
  view.innerHTML=`<section class="sec-head"><span class="eyebrow">Раздел ${s.n} из ${SECS.length} · ${s.grade}</span><h2>${s.name}</h2><p class="short">${s.short}</p>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="theory" aria-selected="${tab==='theory'}">Теория</button><button class="tab" role="tab" data-t="lab" aria-selected="${tab==='lab'}">Опыты</button></div></section><div id="body"></div>`;
  view.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tabs[s.id]=b.dataset.t;renderSection(s)});
  const body=document.getElementById('body');
  if(tab==='lab'){renderLab(s,body);return}
  const t=s.th;
  body.innerHTML=`<div class="th-grid"><div class="th-main"><p class="lead">${F(t.idea)}</p><div class="formula">${t.formula.map(f=>`<div>${F(f)}</div>`).join('')}</div>
  <h3>Разбор</h3><div class="worked"><p class="wt">${F(t.ex.task)}</p><ol>${t.ex.steps.map(x=>`<li>${F(x)}</li>`).join('')}</ol></div>
  <h3>Запомни</h3><div class="key">${F(t.key)}</div>
  <div class="cta-row"><button class="btn primary go-lab">К опытам →</button></div></div>
  <aside class="th-demo"><div id="dm"></div><p class="demo-cap">${F(t.demoCap)}</p></aside></div>`;
  const f=makeFlask();document.getElementById('dm').appendChild(f.root);f.root.style.width='260px';f.set(t.demo());
  body.querySelector('.go-lab').onclick=()=>{tabs[s.id]='lab';renderSection(s);window.scrollTo({top:0})};
}
{const h=(location.hash||'').slice(1);if(SECS.some(s=>s.id===h))cur=h}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==cur&&(h==='map'||SECS.some(s=>s.id===h))){cur=h;render()}});
render();
})();
